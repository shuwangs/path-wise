name: pathwise
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: pathwise_local
      POSTGRES_DB: pathwise
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathwise -d pathwise"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  postgres_data:
